[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blender-open-mcp"
version = "2.0.0"
description = "Open Models MCP for Blender3D — Control Blender with local AI via Ollama and MCP"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Nirajan Dhakal", email = "dhakalnirajan@gmail.com" },
]
keywords = [
    "blender",
    "blender3d",
    "mcp",
    "model-context-protocol",
    "ollama",
    "ai",
    "3d-modeling",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.6.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
client = [
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
# MCP Server entry point
blender-mcp = "blender_open_mcp.server:main"
# MCP Client entry point
blender-mcp-client = "client.client:main"

[project.urls]
Homepage = "https://github.com/dhakalnirajan/blender-open-mcp"
Repository = "https://github.com/dhakalnirajan/blender-open-mcp"
Issues = "https://github.com/dhakalnirajan/blender-open-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_open_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "client/",
    "addon.py",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
